services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/srv/models
    environment:
      APP_CORS_ALLOW_ORIGINS: '["http://localhost:5173","http://localhost:4173"]'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "4173:4173"
    depends_on:
      - backend
